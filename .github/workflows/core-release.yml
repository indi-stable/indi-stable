name: indi-stable-core release

# The gate DESIGN.md's "Versioning policy" describes for indi-stable-core:
# poll indilib/indi for a newer stable tag, build it on both distros, run
# the smoke test (clean install, indiserver starts, a representative
# driver loads), and promote only what passes -- no manual click-to-build
# in the normal path, a human is involved only when the gate fails.
#
# Scope: indi-stable-core only. 3rdparty has its own equivalent workflow
# (.github/workflows/3rdparty-release.yml), which BUILDS AGAINST the release
# this one produces -- it downloads core's -devel/-dev packages from the
# GitHub Release rather than rebuilding them, so a change to what core
# publishes here is a change to that workflow's inputs. pyindi-client is
# still manual; it releases on PyPI rather than as a GitHub tag and needs a
# different upstream check. See STATUS.md.
# GitHub-hosted runners throughout, not fedoraastro/ubuntuastro (those
# VMs cannot stay up permanently to serve a scheduled poll, and the build
# steps below don't need anything specific to them -- `mock` exists to
# protect a persistent host's state, which is moot inside an
# already-disposable CI container). No COPR/OBS publish yet -- a gated
# build becomes a GitHub Release instead; see DESIGN.md's own "Build-logic
# portability" section for why that is a deferred addition, not a
# redesign.
#
# All four jobs below are chained with `needs:`, not by one workflow
# triggering another via a push -- the default GITHUB_TOKEN cannot
# re-trigger a workflow from its own push, by GitHub's own design (loop
# prevention), which is exactly the shape DESIGN.md's original four-
# separate-.yml-files sketch would have needed.

on:
  schedule:
    # Daily, off-peak UTC. Upstream stable tags are infrequent; polling
    # more often buys nothing.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      repackage:
        description: >-
          Rebuild the CURRENT upstream version at the next Release number,
          instead of polling for a new one. For when the packaging changed
          and upstream did not.
        type: boolean
        default: false
      build_only:
        description: >-
          Rehearsal. Build and smoke-test every platform, then STOP before
          promote -- no GitHub Release, no tag, no commit to main, and no
          release number consumed. Resolves the version the same way
          repackage does, so it builds what is currently committed rather
          than waiting for a new upstream tag. Use it to exercise a change to
          this workflow before letting it publish anything.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  DEBFULLNAME: Will Snyder
  DEBEMAIL: william@williamlsnyder.org

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # new_tag drives every downstream `if:` unchanged. In repackage mode it
      # carries the CURRENT version rather than a newly-found one, which is
      # what lets the whole pipeline below stay exactly as it is -- the only
      # things that differ are the release number and the release tag name.
      new_tag: ${{ steps.resolve.outputs.new_tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check indilib/indi for a newer stable tag
        id: check
        if: inputs.repackage != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-upstream-tag.sh indilib/indi core
      - name: Compute the next release (repackage only)
        id: next
        # build_only resolves the version exactly as repackage does -- it
        # builds what is currently committed instead of waiting for a new
        # upstream tag, which is the only way a rehearsal can build anything
        # at all on a quiet day. The release number it computes is never
        # consumed, because promote is skipped.
        if: inputs.repackage == true || inputs.build_only == true
        run: bash scripts/next-release.sh core/rpm/indi-stable-core.spec
      # One place decides the version and release for the whole run, so a
      # build job and the promote job cannot arrive at different answers.
      - name: Resolve what this run builds
        id: resolve
        run: |
          if [ "${{ inputs.repackage }}" = "true" ] || [ "${{ inputs.build_only }}" = "true" ]; then
            echo "new_tag=v${{ steps.next.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "release=${{ steps.next.outputs.release }}"  >> "$GITHUB_OUTPUT"
            echo "repackage: v${{ steps.next.outputs.version }} release ${{ steps.next.outputs.release }}"
          else
            echo "new_tag=${{ steps.check.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
            echo "release=1" >> "$GITHUB_OUTPUT"
            echo "poll: '${{ steps.check.outputs.new_tag }}' release 1"
          fi

  build-fedora:
    needs: check
    if: needs.check.outputs.new_tag != ''
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Just the tools, not the spec's own BuildRequires -- those come from
      # `dnf builddep` below, reading core.spec directly, so this list can
      # never drift out of sync with what the spec actually declares the
      # way a hand-typed duplicate list would.
      - name: Install RPM build tools
        run: dnf install -y rpm-build rpmdevtools dnf-plugins-core
      # Transient -- this checkout is thrown away when the job ends. The
      # real, committed bump happens once in the `promote` job, only if
      # the gate passes on both distros.
      - name: Bump spec Version to the new tag (this checkout only)
        env:
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          sed -i "s/^Version:\([[:space:]]*\).*$/Version:\1${NEW_TAG#v}/" core/rpm/indi-stable-core.spec
          sed -i "s/^Release:\([[:space:]]*\)[0-9][0-9]*/Release:\1${RELEASE}/" core/rpm/indi-stable-core.spec
          grep -E '^Version:|^Release:' core/rpm/indi-stable-core.spec
      - name: Resolve BuildRequires from the spec
        run: dnf builddep -y core/rpm/indi-stable-core.spec
      - name: Fetch upstream source and build
        run: |
          rpmdev-setuptree
          spectool -g -R core/rpm/indi-stable-core.spec
          rpmbuild -bb core/rpm/indi-stable-core.spec
      - name: Collect built RPMs
        run: |
          mkdir -p out
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' \
            ! -name '*debuginfo*' ! -name '*debugsource*' \
            -exec cp {} out/ \;
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: core-rpm
          path: out/
          if-no-files-found: error

  build-debian:
    needs: check
    if: needs.check.outputs.new_tag != ''
    # THREE Debian-family platforms, one job definition. Each is a container
    # rather than a GitHub-hosted runner label, for three reasons:
    #   1. Debian has no hosted runner at all, so debian:12 needs a container
    #      regardless -- the same pattern build-fedora already uses.
    #   2. It pins the distro exactly. ubuntu-26.04 is still a PREVIEW label,
    #      and this job previously depended on it; the image does not move
    #      under us the way a label can.
    #   3. It matches smoke-test-fedora, which has always run in a container,
    #      and makes the smoke tests a genuinely fresh install rather than a
    #      runner image with half a toolchain already on it.
    # Verified 2026-09-11 that all three tags exist on Docker Hub.
    #
    # WHY THE VERSION CARRIES A DISTRO SUFFIX. All three platforms otherwise
    # emit a byte-different file at the IDENTICAL name
    # (indi-stable-core_2.2.4.2-1_amd64.deb). promote copies every artifact
    # into one directory before uploading, so two of the three would be
    # silently overwritten and the release would ship one arbitrary
    # platform's build under a name claiming to be universal. Suffixing the
    # VERSION rather than just the filename also means `dpkg -l` on a user's
    # box answers "which build is this?", which a filename cannot once the
    # package is installed. `~` sorts BEFORE the bare version, the ordinary
    # Debian convention, so none of these ever outranks a plain 2.2.4.2-1.
    #
    # fail-fast: false -- one platform breaking should show the others'
    # results too, not cancel them. A release is gated on all three (see
    # promote's needs:), so hiding two failures behind the first wastes a run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 has NO libxisf-dev in any pocket, and Ubuntu 24.04 has
          # 0.2.8, which predates the CompressionCodecSupported()/ZSTD API
          # indiccd.cpp calls. Both therefore build with the noxisf profile,
          # which decides the libxisf-dev build dependency and the configure
          # flag together. Ubuntu 26.04 carries libxisf-dev 0.2.13 and builds
          # XISF in, unprofiled -- which is exactly why this job was pinned
          # away from ubuntu-latest back when that meant 24.04. DESIGN.md,
          # "Decided: no XISF on Debian 12 and Ubuntu 24.04".
          - id: debian12
            image: debian:12
            vsuffix: '~deb12'
            profiles: pkg.indi-stable-core.noxisf
          - id: ubuntu2404
            image: ubuntu:24.04
            vsuffix: '~ubuntu24.04'
            profiles: pkg.indi-stable-core.noxisf
          - id: ubuntu2604
            image: ubuntu:26.04
            vsuffix: '~ubuntu26.04'
            profiles: ''
    container: ${{ matrix.image }}
    env:
      # Read by BOTH mk-build-deps and dpkg-buildpackage below. Confirmed by
      # running it on a real bookworm box, not assumed: without this,
      # mk-build-deps exits 1 there because libxisf-dev is unsatisfiable;
      # with it, it exits 0 and the equivs package it generates omits
      # libxisf-dev entirely. An empty value means "no profiles", which is
      # what the Ubuntu 26.04 entry wants.
      DEB_BUILD_PROFILES: ${{ matrix.profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # These images are minimal, so this installs what a hosted runner would
      # already have had: curl/ca-certificates to fetch the tarball, git for
      # checkout, devscripts for dch, equivs for mk-build-deps' backend.
      # No sudo -- a container runs as root, and none of these images ship
      # sudo anyway. Same as build-fedora.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl devscripts equivs git
      - name: Fetch and unpack upstream source
        env:
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
        run: |
          NEW_VERSION="${NEW_TAG#v}"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "SRCDIR=/tmp/indi-${NEW_VERSION}" >> "$GITHUB_ENV"
          curl -fsSL -o "/tmp/${NEW_TAG}.tar.gz" \
            "https://github.com/indilib/indi/archive/refs/tags/${NEW_TAG}.tar.gz"
          tar xzf "/tmp/${NEW_TAG}.tar.gz" -C /tmp
      # Transient, same as the Fedora job's spec bump -- this unpacked
      # tree and its debian/ never get committed; only `promote` commits
      # for real.
      #
      # rm -rf debian FIRST is load-bearing -- found the hard way running
      # this exact job, 2026-08-27: indi's own tarball DOES ship its own
      # debian/ (indi-bin, libindi1, libindi-data, libindi-dev, upstream's
      # own packaging, confirmed by reading the real tarball), exactly the
      # same trap DEBIAN.md's core/deb section already documents and this
      # workflow's own earlier comment wrongly claimed didn't apply here.
      # Without the rm -rf, `cp -r core/deb "$SRCDIR/debian"` copies OUR
      # tree INSIDE theirs as debian/deb instead of replacing it, so
      # dpkg-buildpackage silently builds upstream's own unmodified
      # packaging -- wrong names, no private prefix, nothing this project
      # exists to guarantee. Caught only because smoke-test-debian
      # couldn't find an indi-stable-core*.deb afterward and failed loudly
      # rather than promoting it.
      - name: Populate debian/ and bump changelog (this checkout only)
        run: |
          rm -rf "$SRCDIR/debian"
          cp -r core/deb "$SRCDIR/debian"
          cd "$SRCDIR"
          dch --changelog debian/changelog --newversion "${NEW_VERSION}-${{ needs.check.outputs.release }}${{ matrix.vsuffix }}" \
            --distribution unstable \
            "Rebuild of ${{ needs.check.outputs.new_tag }} at release ${{ needs.check.outputs.release }} for ${{ matrix.image }}, built by core-release.yml"
          head -1 debian/changelog
      - name: Resolve Build-Depends from debian/control
        run: mk-build-deps -i -t 'apt-get -y --no-install-recommends' "$SRCDIR/debian/control"
      - name: Build
        run: |
          cd "$SRCDIR"
          dpkg-buildpackage -us -uc -b
      # Assert the suffix actually landed on the built files. dch silently
      # accepts a --newversion it considers lower than the current one only
      # by refusing, but a matrix entry with an empty or mistyped vsuffix
      # would otherwise produce a file named identically to another
      # platform's and reintroduce exactly the collision the suffix exists to
      # prevent -- silently, at the point where promote overwrites one with
      # the other.
      - name: Collect built DEBs
        run: |
          mkdir -p out
          find /tmp -maxdepth 1 -name '*.deb' \
            ! -name '*-dbgsym*' \
            -exec cp {} out/ \;
          ls -la out/
          test -n "$(ls out/)" || { echo "ERROR: no .deb collected"; exit 1; }
          for f in out/*.deb; do
            case "$f" in
              *"${{ needs.check.outputs.release }}${{ matrix.vsuffix }}"*) ;;
              *) echo "ERROR: $f does not carry the expected version suffix '${{ matrix.vsuffix }}'"
                 echo "       Without it this platform's files collide with another's in promote."
                 exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: core-deb-${{ matrix.id }}
          path: out/
          if-no-files-found: error

  smoke-test-fedora:
    needs: build-fedora
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: core-rpm
          path: rpms
      - run: bash scripts/smoke-test-core.sh rpms

  smoke-test-debian:
    needs: build-debian
    # Each platform is smoke-tested in the SAME image it was built in, which
    # is the whole point of matrixing this rather than testing one build
    # everywhere: indi-stable-core-libs carries its own glibc/libstdc++ ABI
    # requirement, and the three builds genuinely differ on it -- measured on
    # the VMs 2026-09-11, bookworm's build requires libc6 >= 2.34 and noble's
    # >= 2.38. Installing one platform's .deb on another is a different test
    # that can fail for reasons the packaging is not responsible for, and can
    # equally pass while hiding a real mismatch.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian12
            image: debian:12
          - id: ubuntu2404
            image: ubuntu:24.04
          - id: ubuntu2604
            image: ubuntu:26.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The script runs apt-get itself and these images ship no sudo; a
      # container is already root. Same reasoning as build-debian's own
      # tooling step.
      - name: Install test tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/download-artifact@v4
        with:
          name: core-deb-${{ matrix.id }}
          path: debs
      - run: bash scripts/smoke-test-core-deb.sh debs

  promote:
    needs: [check, smoke-test-fedora, smoke-test-debian]
    # Skipped entirely for a build_only rehearsal: no GitHub Release,
    # no tag, no version-bump commit, no PR self-merged into main, and
    # no release number consumed. Everything that actually publishes
    # lives in this job, so one condition here is the whole gate.
    if: inputs.build_only != true
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required here, unlike every other checkout in this
      # workflow. This job's own "Fast-forward development from main" step
      # does `git fetch origin main development` then `git merge --ff-only`
      # across the two branches -- the default depth-1 checkout leaves each
      # branch's history truncated at a different point with no shared
      # commit visible locally, so git reports "refusing to merge unrelated
      # histories" even though development really is a clean ancestor of
      # main. Found 2026-09-09 on the first run where self-merge itself
      # actually succeeded (LESSONS_LEARNED.md) -- every earlier promote
      # attempt failed before ever reaching this step, so the bug had never
      # been exercised.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: core-rpm
          path: artifacts/rpm
      # One download per Debian platform. They land in ONE directory on
      # purpose: the distro version suffix makes the filenames distinct, so a
      # collision here would mean the suffix did not take -- and the
      # collision check below turns that into a failed release rather than a
      # release quietly missing two platforms.
      - uses: actions/download-artifact@v4
        with:
          name: core-deb-debian12
          path: artifacts/deb
      - uses: actions/download-artifact@v4
        with:
          name: core-deb-ubuntu2404
          path: artifacts/deb
      - uses: actions/download-artifact@v4
        with:
          name: core-deb-ubuntu2604
          path: artifacts/deb
      # dch, not preinstalled on ubuntu-latest -- the same gap
      # build-debian's own "Install devscripts and equivs" step exists to
      # close, needed again here since this is a separate job/runner.
      - name: Install devscripts
        run: sudo apt-get update && sudo apt-get install -y devscripts
      # The real, committed version bump -- only reached once both gates
      # above have passed.
      #
      # One script, not inline sed, matching 3rdparty-release.yml and
      # pyindi-client-release.yml. The inline version this replaces had two
      # real defects: it never wrote an RPM %changelog entry at all (so a
      # genuinely new promotion would leave the spec's changelog silently
      # behind Debian's), and its dch call had no idempotency guard, which
      # produced the duplicate core/deb/changelog entry the 2026-08-28 run
      # left behind to be squashed by hand. Its sed also matched
      # "^Version:        .*" with exactly eight literal spaces and would
      # have silently rewritten nothing had that column ever shifted.
      - name: Bump spec and changelog for real
        run: bash scripts/bump-core-version.sh "${{ needs.check.outputs.new_tag }}" "${{ needs.check.outputs.release }}"
      - name: Update versions.json
        env:
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
        run: |
          jq --arg v "$NEW_TAG" '.core.candidate = $v | .core.release = $v' \
            versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
      # Release BEFORE commit, deliberately -- and this order matters more than
      # it looks. Until 2026-09-05 this was reversed: the version-bump commit
      # landed on `development` first, and the GitHub Release was created
      # after. That leaves a real window, between those two steps, where a
      # concurrently-triggered downstream workflow (3rdparty/pyindi-client
      # reading core's just-committed `versions.json`) could see a release
      # referenced that does not exist yet and 404 trying to download it --
      # loud, not silent, and self-healing the next run, but avoidable
      # entirely by not publishing the pointer before the thing it points to
      # exists. No workflow here uses a `concurrency:` guard, so this
      # ordering is what actually closes the gap, not a lock.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          mkdir -p release-assets
          cp artifacts/rpm/*.rpm artifacts/deb/*.deb release-assets/
          # Three Debian platforms x three binary packages, plus Fedora's.
          # Count rather than trust: a download-artifact step landing on top
          # of another, or a vsuffix that failed to apply, both show up here
          # as a short count, and both would otherwise publish a release
          # silently missing a platform.
          N_DEB=$(ls release-assets/*.deb | wc -l)
          test "$N_DEB" -eq 9 || {
            echo "ERROR: expected 9 .deb files (3 platforms x 3 packages), found ${N_DEB}:"
            ls -la release-assets/
            echo "       A short count means two platforms produced the same filename --"
            echo "       check each build-debian matrix entry's version suffix."
            exit 1; }
          ls -la release-assets/
          # Release 1 keeps the plain name, so existing tags and any link to
          # them stay valid. A repackage gets an explicit -N suffix -- without
          # it `gh release create` fails outright, because the tag for this
          # upstream version already exists. That is not a hypothetical: it is
          # exactly why core's own pipeline cannot be re-run against an
          # already-released tag (STATUS.md).
          REL_TAG="indi-stable-core-${NEW_TAG}"
          REL_TITLE="indi-stable-core ${NEW_TAG}"
          if [ "${RELEASE}" != "1" ]; then
            REL_TAG="${REL_TAG}-${RELEASE}"
            REL_TITLE="${REL_TITLE} (release ${RELEASE})"
          fi
          echo "creating release: ${REL_TAG}"
          gh release create "${REL_TAG}" release-assets/* \
            --title "${REL_TITLE}" \
            --notes "Automated release. Built from upstream indilib/indi ${NEW_TAG}, gated on all four platforms -- Fedora 44, Debian 12, Ubuntu 24.04 and Ubuntu 26.04 (build, clean install, indiserver starts, a representative driver loads, each on the platform it was built for). Debian 12 and Ubuntu 24.04 builds carry no XISF support, because neither archive has a usable libxisf -- see README.md. Unofficial third-party build -- see README.md."
      # main is protected (PR required), so the bump lands via a PR the bot
      # opens and immediately merges itself -- main's branch protection
      # requires a pull request but zero approving reviews, so this is not a
      # bypass, it is the one form of automation that protection already
      # allows. main, not development, is what every workflow here reads
      # from and publishes from (STATUS.md); development is for hand-authored
      # packaging changes, merged to main by hand like any other PR.
      - name: Commit the version bump on a promotion branch, and merge it into main
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The release number belongs in the subject whenever it is not 1.
          # Without it a repackage commit is byte-identical to the original
          # promotion's subject -- confirmed 2026-09-04, when the first real
          # repackage produced a second "promote ... v2.2.4.1" line
          # indistinguishable from the first in git log.
          #
          # An `if` rather than `[ ... ] && SUBJ=...` deliberately. These steps
          # run under bash -e, where the `&&` form is safe ONLY because more
          # commands follow it: POSIX exempts the non-final command of an
          # AND-list from set -e, so a false test there is ignored, but the
          # SAME line as the last line of a step exits 1 and fails the job.
          # Measured both ways, 2026-09-04, after an earlier version of this
          # comment claimed the `&&` form was already broken here and testing
          # showed it was not. The `if` removes the dependence on position.
          SUBJ="core-release: promote indi-stable-core ${NEW_TAG}"
          if [ "${RELEASE}" != "1" ]; then
            SUBJ="${SUBJ} (release ${RELEASE})"
          fi
          BRANCH="ci/promote-core-${NEW_TAG}-${RELEASE}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add core/rpm/indi-stable-core.spec core/deb/changelog versions.json
          git commit \
            -m "${SUBJ}" \
            -m "Automated. Gate passed on both distros: build, clean install, indiserver starts, a representative driver loads. See .github/workflows/core-release.yml."
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$SUBJ" \
            --body "Automated promotion. Gate passed on both distros before this PR was opened -- see this run's own log."
          gh pr merge "$BRANCH" --merge --delete-branch
      # Keeps development from drifting behind main's automated bumps between
      # hand-authored sessions. --ff-only deliberately: if development has
      # commits main doesn't (real work in progress), this fails loudly
      # rather than fabricating a merge commit or overwriting anything.
      - name: Fast-forward development from main
        run: |
          git fetch origin main development
          git checkout development
          git merge --ff-only origin/main
          git push origin development
