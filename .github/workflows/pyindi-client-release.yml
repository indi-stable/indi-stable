name: indi-stable-pyindi-client release

# The third and last component to get the gate core-release.yml established.
# Structurally the SIMPLEST of the three -- one binary package per distro, no
# subpackages, no inter-package version pins -- but the one whose upstream
# differs most:
#
# 1. It releases on PyPI, not as a git tag, so the check is
#    scripts/check-upstream-pypi.sh rather than check-upstream-tag.sh. That
#    script also guards two failure modes a git tag cannot have: a release
#    yanked in place, and a release published as wheels only (this packaging
#    builds from the sdist).
# 2. The version carries no leading "v" -- 2.2.0, not v2.2.0 -- so nothing
#    here strips one. The bump script rejects a leading v outright.
# 3. Source0 must be rewritten to a URL that cannot be derived from the
#    version, because PyPI sdist URLs contain a content-addressed path
#    segment. check-upstream-pypi.sh emits the URL and sha256 as job outputs
#    and they are threaded through to the build and promote jobs, so every
#    consumer uses one API answer rather than re-resolving.
#
# Core is downloaded from its own gated GitHub Release rather than rebuilt,
# same as 3rdparty-release.yml and for the same reasons -- see that file.
# Runner pinning and the chained-jobs shape are as in core-release.yml.

on:
  schedule:
    # Offset from core (09:17) and 3rdparty (10:43).
    - cron: '11 11 * * *'
  workflow_dispatch:
    inputs:
      repackage:
        description: >-
          Rebuild the CURRENT upstream version at the next Release number,
          instead of polling for a new one. For when the packaging changed
          and upstream did not.
        type: boolean
        default: false
      build_only:
        description: >-
          Rehearsal. Build and smoke-test every platform, then STOP before
          promote -- no GitHub Release, no tag, no commit to main, and no
          release number consumed. Resolves the version the same way
          repackage does, so it builds what is currently committed rather
          than waiting for a new upstream tag. Use it to exercise a change to
          this workflow before letting it publish anything.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  DEBFULLNAME: Will Snyder
  DEBEMAIL: william@williamlsnyder.org

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # In repackage mode new_version carries the CURRENT version, so every
      # downstream `if:` and build job below stays exactly as it is.
      new_version: ${{ steps.resolve.outputs.new_version }}
      release: ${{ steps.resolve.outputs.release }}
      sdist_url: ${{ steps.resolve.outputs.sdist_url }}
      sdist_sha256: ${{ steps.resolve.outputs.sdist_sha256 }}
      core_tag: ${{ steps.core.outputs.core_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check PyPI for a newer pyindi-client release
        id: check
        if: inputs.repackage != true
        run: bash scripts/check-upstream-pypi.sh pyindi-client pyindi-client
      - name: Compute the next release (repackage only)
        id: next
        # build_only resolves the version exactly as repackage does, so a
        # rehearsal builds what is currently committed rather than needing a
        # new PyPI release to exist. The release number it computes is never
        # consumed, because promote is skipped.
        if: inputs.repackage == true || inputs.build_only == true
        run: bash scripts/next-release.sh pyindi-client/rpm/indi-stable-pyindi-client.spec
      # A repackage builds the SAME sdist, so its URL and hash come from the
      # spec that is already pinned to them rather than from PyPI again --
      # re-resolving could pick up a different artifact and silently change
      # what a "rebuild" rebuilds.
      - name: Resolve what this run builds
        id: resolve
        run: |
          if [ "${{ inputs.repackage }}" = "true" ] || [ "${{ inputs.build_only }}" = "true" ]; then
            SPEC=pyindi-client/rpm/indi-stable-pyindi-client.spec
            URL=$(sed -n 's|^Source0:[[:space:]]*\(.*\)$|\1|p' "$SPEC" | head -1)
            SHA=$(grep -oE '^echo "[0-9a-f]{64}' "$SPEC" | head -1 | sed 's/^echo "//')
            [ -n "$URL" ] && [ -n "$SHA" ] || { echo "could not read Source0/sha256 from $SPEC" >&2; exit 1; }
            {
              echo "new_version=${{ steps.next.outputs.version }}"
              echo "release=${{ steps.next.outputs.release }}"
              echo "sdist_url=$URL"
              echo "sdist_sha256=$SHA"
            } >> "$GITHUB_OUTPUT"
            echo "repackage: ${{ steps.next.outputs.version }} release ${{ steps.next.outputs.release }}"
          else
            {
              echo "new_version=${{ steps.check.outputs.new_version }}"
              echo "release=1"
              echo "sdist_url=${{ steps.check.outputs.sdist_url }}"
              echo "sdist_sha256=${{ steps.check.outputs.sdist_sha256 }}"
            } >> "$GITHUB_OUTPUT"
            echo "poll: '${{ steps.check.outputs.new_version }}' release 1"
          fi
      - name: Resolve the core release to build against
        id: core
        run: |
          # The PUBLISHED RELEASE TAG, not the upstream version. These differ
          # the moment core is repackaged: upstream v2.2.4.2 rebuilt at
          # release 2 publishes as indi-stable-core-v2.2.4.2-2, while
          # .core.release still reads v2.2.4.2. Constructing
          # "indi-stable-core-${upstream}" therefore resolved to the ORIGINAL
          # release -- which exists, so the download succeeded and returned
          # the wrong, pre-split artifacts. Found 2026-09-11, before the
          # first 3rdparty run against a repackaged core.
          #
          # core's promote writes this field, so one place decides the
          # identity of what was published and consumers do not rebuild the
          # string from parts. No fallback to .core.release: a missing field
          # means core has not promoted since this was introduced, and
          # guessing would resolve to exactly the wrong release again.
          CORE_TAG=$(jq -r '.core.release_tag // empty' versions.json)
          [ -n "$CORE_TAG" ] \
            || { echo "could not read .core.release_tag from versions.json -- core must promote once before this workflow can resolve its release" >&2; exit 1; }
          echo "core_tag=${CORE_TAG}" >> "$GITHUB_OUTPUT"
          echo "building against core release ${CORE_TAG}"

  build-fedora:
    needs: check
    if: needs.check.outputs.new_version != ''
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # gcc-c++ comes from the spec's own BuildRequires via dnf builddep, not
      # from this list -- it was missing once already (STATUS.md: python3-devel
      # pulls gcc but not gcc-c++, and this package compiles a SWIG .cxx).
      - name: Install RPM build tools
        run: dnf install -y rpm-build rpmdevtools dnf-plugins-core gh jq
      - name: Download the gated core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core-rpms
          gh release download "${{ needs.check.outputs.core_tag }}" \
            --repo "${{ github.repository }}" --pattern '*.rpm' --dir core-rpms
          dnf install -y ./core-rpms/indi-stable-core-*.rpm
      # Transient: rewrites Version:, Source0: and the %prep sha256 in this
      # checkout only. The real committed bump happens once in promote, and
      # only if both gates pass.
      - name: Point the spec at the new release (this checkout only)
        run: |
          bash scripts/bump-pyindi-client-version.sh --spec-only \
            "${{ needs.check.outputs.new_version }}" \
            "${{ needs.check.outputs.sdist_url }}" \
            "${{ needs.check.outputs.sdist_sha256 }}" "${{ needs.check.outputs.release }}"
      - name: Resolve BuildRequires from the spec
        run: dnf builddep -y pyindi-client/rpm/indi-stable-pyindi-client.spec
      - name: Fetch upstream sdist and build
        run: |
          rpmdev-setuptree
          spectool -g -R pyindi-client/rpm/indi-stable-pyindi-client.spec
          rpmbuild -bb pyindi-client/rpm/indi-stable-pyindi-client.spec
      - name: Collect built RPMs
        run: |
          mkdir -p out
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' \
            ! -name '*debuginfo*' ! -name '*debugsource*' -exec cp {} out/ \;
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: pyindi-client-rpm
          path: out/
          if-no-files-found: error

  build-debian:
    needs: check
    if: needs.check.outputs.new_version != ''
    # Three platforms, matching core-release.yml's own build-debian -- see
    # that file for the full reasoning on containers and version suffixes.
    #
    # For THIS component the platform split is the entire point: the compiled
    # SWIG extension is built against the box's own Python, so each platform
    # produces a genuinely different module -- _PyIndi.cpython-311 on
    # bookworm, -312 on noble, -314 on resolute. Verified by hand on the VMs
    # 2026-09-11. One build could never have served all three.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian12
            image: debian:12
            vsuffix: '~deb12'
            asset_glob: '*deb12_*.deb'
          - id: ubuntu2404
            image: ubuntu:24.04
            vsuffix: '~ubuntu24.04'
            asset_glob: '*ubuntu24.04_*.deb'
          - id: ubuntu2604
            image: ubuntu:26.04
            vsuffix: '~ubuntu26.04'
            asset_glob: '*ubuntu26.04_*.deb'
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl devscripts equivs git gh
      # asset_glob, NOT the '~' vsuffix: GitHub REWRITES '~' to '.' when it
      # stores a release asset, so a file built as ...-2~deb12_amd64.deb is
      # served as ...-2.deb12_amd64.deb and a '*~deb12_*' pattern matches
      # nothing. Found on the first real release, 2026-09-11, by reading the
      # published asset names. The package's own Version field still carries
      # the '~' and is unaffected.
      - name: Download this platform's core packages from the gated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core-debs
          gh release download "${{ needs.check.outputs.core_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.asset_glob }}" --dir core-debs
          test -n "$(ls core-debs/*.deb 2>/dev/null)" || {
            echo "ERROR: the core release has no ${{ matrix.vsuffix }} packages. core must be"
            echo "       released with per-platform suffixes before pyindi-client can build."
            exit 1; }
          apt-get install -y ./core-debs/*.deb
      # The sdist comes from the URL the check job resolved, and its hash is
      # verified HERE rather than trusted -- the RPM side gets this free from
      # the spec's own %prep check, and the Debian side would otherwise build
      # whatever it downloaded.
      - name: Fetch and verify the upstream sdist
        env:
          NEW_VERSION: ${{ needs.check.outputs.new_version }}
          SDIST_URL: ${{ needs.check.outputs.sdist_url }}
          SDIST_SHA: ${{ needs.check.outputs.sdist_sha256 }}
        run: |
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "SRCDIR=/tmp/pyindi-client-${NEW_VERSION}" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/pyindi.tar.gz "$SDIST_URL"
          echo "${SDIST_SHA}  /tmp/pyindi.tar.gz" | sha256sum -c - \
            || { echo "sdist sha256 mismatch -- PyPI served something other than what the check job resolved"; exit 1; }
          mkdir -p "/tmp/pyindi-client-${NEW_VERSION}"
          tar xzf /tmp/pyindi.tar.gz -C "/tmp/pyindi-client-${NEW_VERSION}" --strip-components=1
      - name: Populate debian/ and bump changelog (this checkout only)
        run: |
          rm -rf "$SRCDIR/debian"
          cp -r pyindi-client/deb "$SRCDIR/debian"
          cd "$SRCDIR"
          dch --changelog debian/changelog --newversion "${NEW_VERSION}-${{ needs.check.outputs.release }}${{ matrix.vsuffix }}" \
            --distribution unstable \
            "Rebuild of ${NEW_VERSION} at release ${{ needs.check.outputs.release }} for ${{ matrix.image }}, built by pyindi-client-release.yml"
          head -1 debian/changelog
      - name: Resolve Build-Depends from debian/control
        run: mk-build-deps -i -t 'apt-get -y --no-install-recommends' "$SRCDIR/debian/control"
      - name: Build
        run: cd "$SRCDIR" && dpkg-buildpackage -us -uc -b
      - name: Collect built DEBs
        run: |
          mkdir -p out
          find /tmp -maxdepth 1 -name '*.deb' ! -name '*-dbgsym*' -exec cp {} out/ \;
          ls -la out/
          test -n "$(ls out/)" || { echo "ERROR: no .deb collected"; exit 1; }
          for f in out/*.deb; do
            case "$f" in
              *"${{ matrix.vsuffix }}"*) ;;
              *) echo "ERROR: $f does not carry the expected suffix '${{ matrix.vsuffix }}'"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pyindi-client-deb-${{ matrix.id }}
          path: out/
          if-no-files-found: error

  smoke-test-fedora:
    needs: [check, build-fedora]
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install gh
        run: dnf install -y gh
      - name: Download the gated core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core-rpms
          gh release download "${{ needs.check.outputs.core_tag }}" \
            --repo "${{ github.repository }}" --pattern '*.rpm' --dir core-rpms
      - uses: actions/download-artifact@v4
        with:
          name: pyindi-client-rpm
          path: py-rpms
      - run: bash scripts/smoke-test-pyindi-client.sh py-rpms core-rpms

  smoke-test-debian:
    needs: [check, build-debian]
    # Each platform tested in the image it was built in, which matters more
    # here than anywhere else: this gate imports the compiled extension and
    # checks every symbol PyIndi.py references is exported by it. That check
    # is only meaningful against the interpreter the module was built for --
    # a cpython-311 module on a 3.12 box does not import at all, which would
    # fail for a reason that says nothing about the packaging.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian12
            image: debian:12
            vsuffix: '~deb12'
            asset_glob: '*deb12_*.deb'
          - id: ubuntu2404
            image: ubuntu:24.04
            vsuffix: '~ubuntu24.04'
            asset_glob: '*ubuntu24.04_*.deb'
          - id: ubuntu2604
            image: ubuntu:26.04
            vsuffix: '~ubuntu26.04'
            asset_glob: '*ubuntu26.04_*.deb'
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install test tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh
      - name: Download this platform's core packages from the gated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core-debs
          gh release download "${{ needs.check.outputs.core_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.asset_glob }}" --dir core-debs
          test -n "$(ls core-debs/*.deb 2>/dev/null)" || {
            echo "ERROR: core release has no ${{ matrix.vsuffix }} packages -- see build-debian"
            exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: pyindi-client-deb-${{ matrix.id }}
          path: py-debs
      - run: bash scripts/smoke-test-pyindi-client-deb.sh py-debs core-debs

  promote:
    needs: [check, smoke-test-fedora, smoke-test-debian]
    # Serialized ACROSS all three release workflows, because all three write
    # the same two refs: they commit to main via a self-merged PR and then
    # fast-forward development. Two promotions overlapping race on those,
    # and a manual dispatch overlapping a scheduled run is the realistic way
    # that happens -- the crons are staggered, dispatches are not.
    #
    # Scoped to THIS JOB, not the whole workflow, deliberately. A
    # workflow-level group would serialize entire ~25-60 minute pipelines,
    # and GitHub keeps only ONE run pending per group -- a third would be
    # silently cancelled, losing a scheduled poll. promote is the only job
    # touching shared state and runs in a couple of minutes, so serializing
    # just this one makes eviction a non-issue.
    #
    # cancel-in-progress: false -- cancelling a promotion midway could leave
    # a published release with no committed version bump. Queue, never kill.
    concurrency:
      group: indi-stable-promotion
      cancel-in-progress: false
    # Skipped entirely for a build_only rehearsal: no GitHub Release,
    # no tag, no version-bump commit, no PR self-merged into main, and
    # no release number consumed. Everything that actually publishes
    # lives in this job, so one condition here is the whole gate.
    if: inputs.build_only != true
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required here, unlike every other checkout in this
      # workflow. This job's own "Fast-forward development from main" step
      # does `git fetch origin main development` then `git merge --ff-only`
      # across the two branches -- the default depth-1 checkout leaves each
      # branch's history truncated at a different point with no shared
      # commit visible locally, so git reports "refusing to merge unrelated
      # histories" even though development really is a clean ancestor of
      # main. Found 2026-09-09 on the first run where self-merge itself
      # actually succeeded (LESSONS_LEARNED.md) -- every earlier promote
      # attempt failed before ever reaching this step, so the bug had never
      # been exercised.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pyindi-client-rpm
          path: artifacts/rpm
      # One per platform. They share a directory because the version suffix
      # makes every filename distinct; the count check below turns a suffix
      # that failed to apply into a failed release rather than a release
      # quietly carrying one platform's module three times.
      - uses: actions/download-artifact@v4
        with:
          name: pyindi-client-deb-debian12
          path: artifacts/deb
      - uses: actions/download-artifact@v4
        with:
          name: pyindi-client-deb-ubuntu2404
          path: artifacts/deb
      - uses: actions/download-artifact@v4
        with:
          name: pyindi-client-deb-ubuntu2604
          path: artifacts/deb
      - name: Install devscripts
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - name: Bump every version-carrying field for real
        run: |
          bash scripts/bump-pyindi-client-version.sh \
            "${{ needs.check.outputs.new_version }}" \
            "${{ needs.check.outputs.sdist_url }}" \
            "${{ needs.check.outputs.sdist_sha256 }}" "${{ needs.check.outputs.release }}"
      - name: Update versions.json
        env:
          NEW_VERSION: ${{ needs.check.outputs.new_version }}
        run: |
          jq --arg v "$NEW_VERSION" '.["pyindi-client"].candidate = $v | .["pyindi-client"].release = $v' \
            versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
      # Release BEFORE commit, deliberately -- and this order matters more than
      # it looks. Until 2026-09-05 this was reversed: the version-bump commit
      # landed on `development` first, and the GitHub Release was created
      # after. That leaves a real window, between those two steps, where a
      # concurrently-triggered downstream workflow (3rdparty/pyindi-client
      # reading core's just-committed `versions.json`) could see a release
      # referenced that does not exist yet and 404 trying to download it --
      # loud, not silent, and self-healing the next run, but avoidable
      # entirely by not publishing the pointer before the thing it points to
      # exists. The concurrency group on this job serializes promotions
      # against each other, but it does NOT close this gap -- the window is
      # between two steps of a SINGLE run, which no lock against other runs
      # can help with. This ordering is what closes it.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ needs.check.outputs.new_version }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          mkdir -p release-assets
          cp artifacts/rpm/*.rpm artifacts/deb/*.deb release-assets/
          # One .deb per platform. A short count means two platforms produced
          # the same filename -- i.e. a version suffix did not apply -- and
          # the release would otherwise ship one platform's compiled module
          # while appearing to cover three.
          N_DEB=$(ls release-assets/*.deb | wc -l)
          test "$N_DEB" -eq 3 || {
            echo "ERROR: expected 3 .deb files (one per platform), found ${N_DEB}:"
            ls -la release-assets/
            exit 1; }
          # Release 1 keeps the plain name so existing tags stay valid; a
          # repackage gets an explicit -N suffix, without which gh release
          # create fails on the already-existing tag.
          REL_TAG="indi-stable-pyindi-client-${NEW_VERSION}"
          REL_TITLE="indi-stable-pyindi-client ${NEW_VERSION}"
          if [ "${RELEASE}" != "1" ]; then
            REL_TAG="${REL_TAG}-${RELEASE}"
            REL_TITLE="${REL_TITLE} (release ${RELEASE})"
          fi
          echo "creating release: ${REL_TAG}"
          gh release create "${REL_TAG}" release-assets/* \
            --title "${REL_TITLE}" \
            --notes "Automated release. Built from the PyPI pyindi-client ${NEW_VERSION} sdist against core release ${{ needs.check.outputs.core_tag }}, gated on all four platforms -- Fedora 44, Debian 12, Ubuntu 24.04 and Ubuntu 26.04, each built and imported against that platform's own Python. Linked against this project's own libindiclient rather than any system libindi. Unofficial third-party build -- see README.md."
      # main is protected (PR required), so the bump lands via a PR the bot
      # opens and immediately merges itself -- main's branch protection
      # requires a pull request but zero approving reviews, so this is not a
      # bypass, it is the one form of automation that protection already
      # allows. main, not development, is what every workflow here reads
      # from and publishes from (STATUS.md); development is for hand-authored
      # packaging changes, merged to main by hand like any other PR.
      - name: Commit the version bump on a promotion branch, and merge it into main
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ needs.check.outputs.new_version }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The release number belongs in the subject whenever it is not 1.
          # Without it a repackage commit is byte-identical to the original
          # promotion's subject -- confirmed 2026-09-04, when the first real
          # repackage produced a second "promote ... v2.2.4.1" line
          # indistinguishable from the first in git log.
          #
          # An `if` rather than `[ ... ] && SUBJ=...` deliberately. These steps
          # run under bash -e, where the `&&` form is safe ONLY because more
          # commands follow it: POSIX exempts the non-final command of an
          # AND-list from set -e, so a false test there is ignored, but the
          # SAME line as the last line of a step exits 1 and fails the job.
          # Measured both ways, 2026-09-04, after an earlier version of this
          # comment claimed the `&&` form was already broken here and testing
          # showed it was not. The `if` removes the dependence on position.
          SUBJ="pyindi-client-release: promote indi-stable-pyindi-client ${NEW_VERSION}"
          if [ "${RELEASE}" != "1" ]; then
            SUBJ="${SUBJ} (release ${RELEASE})"
          fi
          BRANCH="ci/promote-pyindi-client-${NEW_VERSION}-${RELEASE}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add pyindi-client/rpm/indi-stable-pyindi-client.spec \
                  pyindi-client/deb/changelog \
                  versions.json
          git commit \
            -m "${SUBJ}" \
            -m "Automated. Gate passed on both distros: build, clean install, the module imports as a real module, BaseClient constructs, every symbol the SWIG wrapper references is exported by the compiled extension, and libindiclient resolves into the private prefix. See .github/workflows/pyindi-client-release.yml."
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$SUBJ" \
            --body "Automated promotion. Gate passed on both distros before this PR was opened -- see this run's own log."
          gh pr merge "$BRANCH" --merge --delete-branch
      # Keeps development from drifting behind main's automated bumps between
      # hand-authored sessions. --ff-only deliberately: if development has
      # commits main doesn't (real work in progress), this fails loudly
      # rather than fabricating a merge commit or overwriting anything.
      - name: Fast-forward development from main
        run: |
          git fetch origin main development
          git checkout development
          git merge --ff-only origin/main
          git push origin development
